# Descarga diaria de precios para Stack y publicacion en Releases.
# Corre solo todos los dias (4:17 am de Mexico) y tambien a mano: pestana Actions > "Datos diarios" > Run workflow.
name: Datos diarios

on:
  schedule:
    - cron: "17 10 * * *"          # 10:17 UTC = 4:17 am en Ciudad de Mexico
  workflow_dispatch:
    inputs:
      tiendas:
        description: "Que bajar (todas / sin-hareruya / sin-scg / solo-scryfall)"
        default: "todas"
      universo:
        description: "SCG: buscar tambien el universo completo (las de menos de $2) aunque no sea domingo (si / no)"
        default: "no"

permissions:
  contents: write                  # para crear el release del dia

concurrency:
  group: datos-diarios
  cancel-in-progress: false

env:
  TZ: America/Mexico_City          # el dia de cada captura se cuenta en hora de Mexico (como en tu PC)
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  # 1) Lo de ayer (del ultimo release) + Scryfall + MTGJSON + Card Kingdom
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Traer los datos del ultimo release
        run: |
          mkdir -p anterior
          gh release download --repo "$GITHUB_REPOSITORY" --dir anterior --pattern 'manifest.json' \
            --pattern 'historial.sqlite.gz' --pattern 'hareruya_historial.sqlite.gz' --pattern 'scg.sqlite.gz' \
            --pattern 'ck.sqlite.gz' --pattern 'hareruya_emparejado.sqlite.gz' --pattern 'scg_universo.sqlite.gz' \
            --pattern 'hareruya_universo.sqlite.gz' --pattern 'meta.sqlite.gz' || echo "Todavia no hay releases: se empieza de cero."
          python .github/nube.py restaurar anterior
      - name: Scryfall (Main1)
        run: python src/scryfall.py
      - name: Universo (todas las cartas de papel, para las de menos de $2) y oraculo (reglas de cada carta)
        continue-on-error: true
        run: python .github/nube.py universo
      - name: MTGJSON
        continue-on-error: true
        run: python src/mtgjson.py
      - name: Nombres de las cartas en otros idiomas (para buscar en espanol en Stack)
        continue-on-error: true
        run: python src/mtgjson.py nombres
      - name: Card Kingdom
        continue-on-error: true
        run: python src/cardkingdom.py descargar
      - name: Guardar para los siguientes pasos
        run: |
          mkdir -p data && echo capa > data/.capa
          rm -rf data/precios/mtgjson
      - uses: actions/upload-artifact@v4
        with:
          name: base
          path: |
            data/.capa
            data/precios/historial.sqlite
            data/precios/scryfall/
            data/tiendas/cardkingdom/ck.sqlite
            data/tiendas/starcitygames/scg.sqlite
            data/tiendas/hareruya/historial_hareruya.sqlite
            data/tiendas/hareruya/emparejado/emparejado_*.sqlite
            data/tiendas/starcitygames/scg_universo.sqlite
            data/tiendas/hareruya/universo/historial_hareruya.sqlite
            data/precios/oraculo.sqlite
            data/meta/meta.sqlite
          retention-days: 2
          compression-level: 1
          if-no-files-found: error

  # 2) Hareruya (en paralelo con SCG)
  hareruya:
    needs: base
    if: ${{ github.event.inputs.tiendas != 'sin-hareruya' && github.event.inputs.tiendas != 'solo-scryfall' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: base
          path: data
      - name: Traer la descarga de Hareruya hecha en tu PC
        id: pc
        run: |
          mkdir -p data/tiendas/hareruya/descargas
          gh release download hareruya-pc --repo "$GITHUB_REPOSITORY" --dir data/tiendas/hareruya/descargas --clobber \
            --pattern 'hareruya_seco_*' || echo "No hay descarga de la PC."
          HOY=$(date +%Y%m%d)
          if ls data/tiendas/hareruya/descargas/hareruya_seco_${HOY}_*.jsonl.gz >/dev/null 2>&1; then
            echo "Se usa la descarga de hoy hecha en la PC."
            echo "listo=1" >> "$GITHUB_OUTPUT"
          else
            echo "La PC no subio la de hoy: se intenta descargar desde GitHub."
            rm -f data/tiendas/hareruya/descargas/hareruya_seco_*
          fi
      - name: Juntar el historial de Hareruya de tu PC (agrega los dias que falten; nunca reemplaza)
        run: |
          mkdir -p pc
          if gh release download hareruya-pc --repo "$GITHUB_REPOSITORY" --dir pc --clobber --pattern 'historial_hareruya_pc.sqlite.gz'; then
            python src/hareruya.py juntar pc/historial_hareruya_pc.sqlite.gz
          else
            echo "La PC no subio su historial."
          fi
      - name: Descargar Hareruya
        if: ${{ steps.pc.outputs.listo != '1' }}
        continue-on-error: true
        run: python src/hareruya.py descargar                 # 16 procesos (lo normal de hareruya.py)
      - name: Revisar que Hareruya si respondio
        id: revisar
        if: ${{ steps.pc.outputs.listo != '1' }}
        continue-on-error: true            # aunque Hareruya no responda, el historial juntado de tu PC si se publica
        run: |
          python - <<'PY'
          import gzip, json, sys
          from pathlib import Path
          prog = json.loads(Path("data/tiendas/hareruya/progreso.json").read_text(encoding="utf-8"))
          print(f"Hareruya: {prog.get('hechas')}/{prog.get('total')} cartas, {prog.get('productos')} productos, {prog.get('errores')} con error")
          if int(prog.get("productos") or 0) > 0:
              sys.exit(0)
          secos = sorted(Path("data/tiendas/hareruya/descargas").glob("hareruya_seco_*.jsonl.gz"))
          if secos:
              with gzip.open(secos[-1], "rt", encoding="utf-8") as f:
                  for _, linea in zip(range(3), f):
                      print("  ", json.loads(linea).get("detalle"))
          print("::error::Hareruya no devolvio productos (probablemente bloqueo a GitHub). Se publica el de la ultima vez.")
          sys.exit(1)
          PY
      - name: Emparejar con Scryfall
        if: ${{ steps.pc.outputs.listo == '1' || steps.revisar.outcome == 'success' }}
        run: python src/hareruya.py emparejar
      - name: Pasar al historial
        if: ${{ steps.pc.outputs.listo == '1' || steps.revisar.outcome == 'success' }}
        run: python src/hareruya.py historial
      - name: Universo de Hareruya (lo sube tu PC una vez por semana)
        continue-on-error: true
        run: |
          mkdir -p universo_pc data/tiendas/hareruya/universo/descargas
          gh release download hareruya-pc --repo "$GITHUB_REPOSITORY" --dir universo_pc --clobber --pattern 'universo_hareruya_seco_*' \
            || { echo "La PC no ha subido un universo."; exit 0; }
          for f in universo_pc/universo_*; do mv "$f" "data/tiendas/hareruya/universo/descargas/$(basename "$f" | sed 's/^universo_//')"; done
          python - <<'PY' && STACK_UNIVERSO=1 python src/hareruya.py historial --todo || echo "El universo de esta semana ya estaba en el historial."
          import os, sys
          sys.path.insert(0, "src")
          os.environ["STACK_UNIVERSO"] = "1"
          import hareruya as h
          secos = h.archivos_secos()
          if not secos:
              sys.exit(1)
          dia = max(h.dia_de_seco(x) for x in secos)
          ya = h.dias_registrados()
          print(f"Universo de la PC: {dia} · ya en el historial: {dia in ya}")
          sys.exit(1 if dia in ya else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hareruya
          path: |
            data/.capa
            data/tiendas/hareruya/historial_hareruya.sqlite
            data/tiendas/hareruya/emparejado/emparejado_*.sqlite
            data/tiendas/hareruya/universo/historial_hareruya.sqlite
          retention-days: 2
          compression-level: 1

  # 3) StarCityGames (en paralelo con Hareruya)
  scg:
    needs: base
    if: ${{ github.event.inputs.tiendas != 'sin-scg' && github.event.inputs.tiendas != 'solo-scryfall' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: base
          path: data
      - name: Descargar StarCityGames
        run: python src/scg.py descargar
      - name: StarCityGames, universo (las de menos de $2; los domingos)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ "$(date +%u)" = "7" ] || [ "${{ github.event.inputs.universo }}" = "si" ]; then
            STACK_UNIVERSO=1 python src/scg.py descargar
          else
            echo "Hoy no toca el universo (los domingos)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: scg
          path: |
            data/.capa
            data/tiendas/starcitygames/scg.sqlite
            data/tiendas/starcitygames/scg_universo.sqlite
          retention-days: 2
          compression-level: 1

  # 3b) META (0.9.0): decks de MTGO, MTGTop8, MTGGoldfish, TopDeck y EDHREC (en paralelo con las tiendas)
  meta:
    needs: base
    if: ${{ github.event.inputs.tiendas != 'solo-scryfall' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: base
          path: data
      - name: Meta del dia
        env:
          TOPDECK_KEY: ${{ secrets.TOPDECK_KEY }}      # llave gratis de topdeck.gg/developers (sin ella se salta TopDeck)
        run: python src/meta.py
      - uses: actions/upload-artifact@v4
        with:
          name: meta
          path: |
            data/.capa
            data/meta/meta.sqlite
          retention-days: 2
          compression-level: 1

  # 4) Publicar lo que haya salido bien (si una tienda fallo, se publica la de ayer)
  publicar:
    needs: [base, hareruya, scg, meta]
    if: ${{ always() && needs.base.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: base
          path: capas/base/data
      - uses: actions/download-artifact@v4
        if: ${{ needs.hareruya.result == 'success' }}
        with:
          name: hareruya
          path: capas/hareruya/data
      - uses: actions/download-artifact@v4
        if: ${{ needs.scg.result == 'success' }}
        with:
          name: scg
          path: capas/scg/data
      - uses: actions/download-artifact@v4
        if: ${{ needs.meta.result == 'success' }}
        with:
          name: meta
          path: capas/meta/data
      - name: Traer el release de ayer (para publicar solo lo que cambio)
        run: |
          mkdir -p anterior
          gh release download --repo "$GITHUB_REPOSITORY" --dir anterior --pattern '*.sqlite.gz' --pattern 'manifest.json' \
            || echo "No hay release anterior: hoy no hay parches."
          rm -f anterior/parche_*
      - name: Empaquetar
        run: |
          TAG="datos-$(date +%Y-%m-%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          CAPAS="--capa capas/base"
          [ -d capas/hareruya ] && CAPAS="$CAPAS --capa capas/hareruya"
          [ -d capas/scg ] && CAPAS="$CAPAS --capa capas/scg"
          [ -d capas/meta ] && CAPAS="$CAPAS --capa capas/meta"
          python .github/nube.py publicar salida --tag "$TAG" $CAPAS --anterior anterior
      - name: Crear el release del dia
        run: |
          NOTAS="Hareruya: ${{ needs.hareruya.result }} · SCG: ${{ needs.scg.result }} · Meta: ${{ needs.meta.result }}"
          gh release create "$TAG" salida/* --repo "$GITHUB_REPOSITORY" --title "Datos $(date +%Y-%m-%d)" --notes "$NOTAS" --latest
      - name: Borrar releases viejos (se quedan los 7 mas nuevos)
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep '^datos-' | tail -n +8 | \
            while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
      - name: Mantener vivo el horario (GitHub lo apaga si el repositorio no tiene actividad en 60 dias)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date +%u)" = "1" ]; then
            git config user.name "stack-bot"
            git config user.email "stack-bot@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > ultimo_lunes.txt
            git add ultimo_lunes.txt
            git commit -m "latido semanal" && git push || true
          fi
