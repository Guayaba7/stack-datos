# Descarga diaria de precios para Stack y publicacion en Releases.
# Corre solo todos los dias (4:17 am de Mexico) y tambien a mano: pestana Actions > "Datos diarios" > Run workflow.
name: Datos diarios

on:
  schedule:
    - cron: "17 10 * * *"          # 10:17 UTC = 4:17 am en Ciudad de Mexico
  workflow_dispatch:
    inputs:
      tiendas:
        description: "Que bajar (todas / sin-hareruya / sin-scg / solo-scryfall)"
        default: "todas"

permissions:
  contents: write                  # para crear el release del dia

concurrency:
  group: datos-diarios
  cancel-in-progress: false

env:
  TZ: America/Mexico_City          # el dia de cada captura se cuenta en hora de Mexico (como en tu PC)
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  # 1) Lo de ayer (del ultimo release) + Scryfall + MTGJSON + Card Kingdom
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Traer los datos del ultimo release
        run: |
          mkdir -p anterior
          gh release download --repo "$GITHUB_REPOSITORY" --dir anterior || echo "Todavia no hay releases: se empieza de cero."
          python .github/nube.py restaurar anterior
      - name: Scryfall (Main1)
        run: python src/scryfall.py
      - name: MTGJSON
        continue-on-error: true
        run: python src/mtgjson.py
      - name: Card Kingdom
        continue-on-error: true
        run: python src/cardkingdom.py descargar
      - name: Guardar para los siguientes pasos
        run: |
          mkdir -p data && echo capa > data/.capa
          rm -rf data/precios/mtgjson
      - uses: actions/upload-artifact@v4
        with:
          name: base
          path: |
            data/.capa
            data/precios/historial.sqlite
            data/precios/scryfall/
            data/tiendas/cardkingdom/ck.sqlite
            data/tiendas/starcitygames/scg.sqlite
            data/tiendas/hareruya/historial_hareruya.sqlite
          retention-days: 2
          compression-level: 1
          if-no-files-found: error

  # 2) Hareruya (en paralelo con SCG)
  hareruya:
    needs: base
    if: ${{ github.event.inputs.tiendas != 'sin-hareruya' && github.event.inputs.tiendas != 'solo-scryfall' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: base
          path: data
      - name: Descargar Hareruya
        run: python src/hareruya.py descargar
      - name: Emparejar con Scryfall
        run: python src/hareruya.py emparejar
      - name: Pasar al historial
        run: python src/hareruya.py historial
      - uses: actions/upload-artifact@v4
        with:
          name: hareruya
          path: |
            data/.capa
            data/tiendas/hareruya/historial_hareruya.sqlite
            data/tiendas/hareruya/emparejado/emparejado_*.sqlite
          retention-days: 2
          compression-level: 1

  # 3) StarCityGames (en paralelo con Hareruya)
  scg:
    needs: base
    if: ${{ github.event.inputs.tiendas != 'sin-scg' && github.event.inputs.tiendas != 'solo-scryfall' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: base
          path: data
      - name: Descargar StarCityGames
        run: python src/scg.py descargar
      - uses: actions/upload-artifact@v4
        with:
          name: scg
          path: |
            data/.capa
            data/tiendas/starcitygames/scg.sqlite
          retention-days: 2
          compression-level: 1

  # 4) Publicar lo que haya salido bien (si una tienda fallo, se publica la de ayer)
  publicar:
    needs: [base, hareruya, scg]
    if: ${{ always() && needs.base.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: base
          path: capas/base/data
      - uses: actions/download-artifact@v4
        if: ${{ needs.hareruya.result == 'success' }}
        with:
          name: hareruya
          path: capas/hareruya/data
      - uses: actions/download-artifact@v4
        if: ${{ needs.scg.result == 'success' }}
        with:
          name: scg
          path: capas/scg/data
      - name: Empaquetar
        run: |
          TAG="datos-$(date +%Y-%m-%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          CAPAS="--capa capas/base"
          [ -d capas/hareruya ] && CAPAS="$CAPAS --capa capas/hareruya"
          [ -d capas/scg ] && CAPAS="$CAPAS --capa capas/scg"
          python .github/nube.py publicar salida --tag "$TAG" $CAPAS
      - name: Crear el release del dia
        run: |
          NOTAS="Hareruya: ${{ needs.hareruya.result }} · SCG: ${{ needs.scg.result }}"
          gh release create "$TAG" salida/* --repo "$GITHUB_REPOSITORY" --title "Datos $(date +%Y-%m-%d)" --notes "$NOTAS" --latest
      - name: Borrar releases viejos (se quedan los 7 mas nuevos)
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep '^datos-' | tail -n +8 | \
            while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
      - name: Mantener vivo el horario (GitHub lo apaga si el repositorio no tiene actividad en 60 dias)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date +%u)" = "1" ]; then
            git config user.name "stack-bot"
            git config user.email "stack-bot@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > ultimo_lunes.txt
            git add ultimo_lunes.txt
            git commit -m "latido semanal" && git push || true
          fi
